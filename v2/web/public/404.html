    <script>
      // GitHub Pages sirve este archivo para rutas desconocidas (deep links / refresh en la PWA).
      // Redirigimos al shell de la SPA preservando la ruta original.
      (function () {
        var segmentosARetener = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentosARetener).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentosARetener).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
