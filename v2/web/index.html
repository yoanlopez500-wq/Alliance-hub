<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AllianceHub 2.0</title>
    <meta name="description" content="Plataforma de gestión de alianzas y torneos de Supremacy 1914" />
    <meta name="theme-color" content="#0a0e27" />
    <script>
      // Recupera la ruta original cuando GitHub Pages redirige desde /404.html (truco spa-github-pages).
      // El 404.html emite /?/ruta&query=...: el primer segmento es el path y el
      // resto son parametros (la '?' original se reconstruye aqui). Sin esto,
      // las rutas con query (ej. /login?mode=player) morian en el 404 de la SPA.
      (function () {
        var q = window.location.search;
        if (q.indexOf('?/') > -1) {
          var segs = q.slice(2).replace(/~and~/g, '&').split('&');
          var path = segs.shift() || '';
          var target = '/' + path + (segs.length ? '?' + segs.join('&') : '') + window.location.hash;
          window.history.replaceState(null, null, target);
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
