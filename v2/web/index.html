    <script>
      // Recupera la ruta original cuando GitHub Pages redirige desde /404.html (truco spa-github-pages).
      // El 404.html emite /?/ruta&query=...: el primer segmento es el path y el
      // resto son parametros (la '?' original se reconstruye aqui). Sin esto,
      // las rutas con query (ej. /login?mode=player) morian en el 404 de la SPA.
      (function () {
        var q = window.location.search;
        if (q.indexOf('?/') > -1) {
          var segs = q.slice(2).replace(/~and~/g, '&').split('&');
          var path = segs.shift() || '';
          var target = '/' + path + (segs.length ? '?' + segs.join('&') : '') + window.location.hash;
          window.history.replaceState(null, null, target);
        }
      })();
    </script>
